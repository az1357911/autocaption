<h1>自動字幕</h1>
<p>Final Cut Pro用の字幕機能拡張です。プロジェクトをパネルにドラッグすると、お使いのMac上でオフラインで音声を認識し、あなたのタイトルのスタイルに合わせた字幕を作成します。45の言語、台湾華語、翻訳、二か国語字幕に対応しています。</p>
